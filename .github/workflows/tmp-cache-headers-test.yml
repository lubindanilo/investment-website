name: TMP verif cache headers

# JOB TEMPORAIRE, A SUPPRIMER AVANT MERGE. Aucun workflow de ce repo ne lance vitest et Node n'est
# pas installe sur la machine de dev : ce job execute la suite de tests de l'API pour verifier que
# les en-tetes de cache n'ont rien casse.
on:
  push:
    branches: [perf/cache-cdn-lectures-publiques]

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lubin/api exec prisma generate --schema=prisma/schema.prisma
      - name: Suite de tests complete de l API
        run: pnpm --filter @lubin/api run test
