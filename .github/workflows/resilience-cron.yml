name: Resilience backfill (5 etoiles)

# Note le 3e pilier (resilience 5 etoiles) d'un lot d'entreprises par nuit, les plus grosses
# capitalisations d'abord, et s'arrete au plafond quotidien.
#
# POURQUOI CE WORKFLOW EXISTE. Jusqu'au 05/08/2026 ce backfill etait declenche par un job launchd
# sur le Mac de Lubin, pointant sur un script d'un WORKTREE non merge (.claude/worktrees/
# resilience-5star), avec la cle DeepSeek stockee dans le .env de ce meme worktree. Trois points de
# defaillance hors versioning, et le jour ou ce repertoire est nettoye tout disparait, y compris la
# seule copie de la cle. La nuit du 05/08 le job a tourne, est mort en P1017 sur une base Neon
# froide, n'a note AUCUNE entreprise, et a ecrit « exit=0 » dans son log (bug de capture de $?).
# Personne ne pouvait le savoir : ni alerte, ni surveillance, ni etat visible.
#
# AUTHENTIFICATION. Le scoreur passe par le binaire `claude` (services/resilienceStarsCli.ts) et
# non par l'API HTTP, pour s'authentifier via l'ABONNEMENT et non au token facture. En CI cela se
# fait avec un jeton long terme genere par `claude setup-token` (necessite un abonnement), pose en
# secret CLAUDE_CODE_OAUTH_TOKEN. Un ANTHROPIC_API_KEY est accepte en repli, mais il est FACTURE a
# l'usage : c'est un choix de cout, pas un detail de configuration.
#
# DEBIT ET DECOUPAGE (07/08/2026). Le run de 250 a tenu 117 min pour un `timeout-minutes` de 120 :
# il est passe a 3 minutes du couperet. Le debit mesure est de ~2,2 entreprises/min, donc 800 en un
# seul job demanderaient ~364 min, au-dela de la limite DURE de 6 h d'un runner GitHub. Le job est
# donc decoupe en 4 shards paralleles de 200 (800/nuit), chacun sur une fenetre disjointe de la file
# triee par capi (cf. BackfillOptions.offset). Pour revenir a un seul lot, remettre `shard: [0]`.
#
# Secrets requis : DATABASE_URL, DEEPSEEK_API_KEY, et CLAUDE_CODE_OAUTH_TOKEN (ou ANTHROPIC_API_KEY).
# Secret OPTIONNEL mais recommande : CLAUDE_CODE_OAUTH_TOKEN_2 (2e abonnement). Les shards pairs
# utilisent le 1er jeton, les impairs le 2e ; sans ce secret les 4 shards partagent le 1er jeton.
# Variable optionnelle : RESILIENCE_STARS_DAILY_CAP = plafond PAR SHARD (defaut 200).

on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'Entreprises PAR SHARD (4 shards en parallele : total = 4x cette valeur). Vide = variable RESILIENCE_STARS_DAILY_CAP, sinon 200.'
        required: false
        default: ''
  schedule:
    # 21:37 UTC. Minute VOLONTAIREMENT hors debut d'heure : GitHub retarde les workflows planifies
    # en periode de charge, et le pic est le debut de chaque heure. Mesure sur ce repo : les crons
    # en `0 X` partent 2 a 3 h en retard, tous les jours. Cet horaire laisse aussi le job passer
    # avant la fenetre du drain screener, pour ne pas tenir la base Neon eveillee a deux.
    - cron: '37 21 * * *'

permissions:
  contents: read
  # Canal d'alerte de secours (cf. step « Ouvrir une issue en cas d echec »).
  issues: write

concurrency:
  group: resilience-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 300 min. Un runner GitHub est TUE a 6 h (360 min) : a 200 entreprises par shard et ~2,2/min
    # mesurees le 07/08/2026, un shard tient en ~90 min et garde une marge large. C'est la raison
    # d'etre du decoupage : 800 en un seul job demanderaient ~364 min, soit au-dela du couperet.
    timeout-minutes: 300
    strategy:
      # Un shard qui tombe ne doit pas emporter les trois autres : chacun ecrit ses propres lignes.
      fail-fast: false
      # Le nom du secret de jeton est porte par la MATRICE, pas calcule dans une expression.
      # Les expressions GitHub n'ont AUCUN operateur arithmetique : le `matrix.shard % 2 == 0`
      # d'origine (#259) rendait le fichier illisible pour GitHub, qui l'enregistrait sous son
      # chemin au lieu de son `name:` et refusait de le lancer — le cron du 07/08 n'a jamais
      # existe, sans meme un run en echec (donc sans alerte : `if: failure()` n'a pas de job).
      matrix:
        include:
          - shard: 0
            token_secret: CLAUDE_CODE_OAUTH_TOKEN
          - shard: 1
            token_secret: CLAUDE_CODE_OAUTH_TOKEN_2
          - shard: 2
            token_secret: CLAUDE_CODE_OAUTH_TOKEN
          - shard: 3
            token_secret: CLAUDE_CODE_OAUTH_TOKEN_2
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Prisma exige `directUrl` a la generation. Ce job ne migre rien : la meme URL suffit.
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Deux abonnements Claude : les shards pairs prennent le premier jeton, les impairs le second,
      # pour ne pas concentrer quatre scoreurs simultanes sur une seule limite de debit. Si le
      # second secret n'est pas pose, tout retombe sur le premier (degrade mais fonctionnel).
      # `secrets[...]` indexe le contexte par le nom porte par la matrice ; le `||` retombe sur le
      # 1er jeton si le 2e secret n'est pas pose (degrade mais fonctionnel).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[matrix.token_secret] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESILIENCE_STARS_DAILY_CAP: ${{ inputs.cap || vars.RESILIENCE_STARS_DAILY_CAP || '200' }}
    steps:
      - name: Garde-fou secrets
        run: |
          fail=0
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Le secret DATABASE_URL est requis."
            fail=1
          fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Il faut CLAUDE_CODE_OAUTH_TOKEN (abonnement, genere par \`claude setup-token\`) ou ANTHROPIC_API_KEY (facture a l'usage)."
            fail=1
          fi
          # Sans controle croise, classifyVerdict renvoie `flagged` pour TOUTES les entreprises
          # (v3 == null). Elles seraient alors ecrites en base marquees « revue humaine » et
          # ne seraient plus jamais repiochees, puisque le backfill saute ce qui est deja note.
          # Mieux vaut ne pas tourner que polluer la table.
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY manquante : sans le controle croise, toutes les notes seraient marquees flagged de façon definitive."
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "Plafond du run : ${RESILIENCE_STARS_DAILY_CAP} entreprises"
      - uses: actions/checkout@v4
      # Pas de `version:` : pnpm/action-setup lit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lubin/api exec prisma generate --schema=prisma/schema.prisma

      - name: Installer le CLI claude
        run: npm install -g @anthropic-ai/claude-code

      # Echoue en quelques secondes si l'authentification est mauvaise, plutot que de le decouvrir
      # apres avoir engage le scoring d'un lot entier.
      - name: Verifier l authentification du CLI
        run: |
          set -o pipefail
          out="$(printf 'Reponds exactement OK.' | claude -p --model claude-sonnet-5 --output-format json 2>&1)" || {
            echo "::error::Le CLI claude n'est pas authentifie : ${out}"
            exit 1
          }
          echo "CLI claude operationnel."

      - name: Backfill
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Fenetre disjointe : chaque shard lit `cap` candidats a partir du rang `cap * shard`.
          # Les quatre lectures ont lieu avant toute ecriture, donc les fenetres ne se recouvrent pas.
          export RESILIENCE_STARS_OFFSET=$(( RESILIENCE_STARS_DAILY_CAP * SHARD ))
          echo "Shard ${SHARD} : ${RESILIENCE_STARS_DAILY_CAP} entreprises a partir du rang ${RESILIENCE_STARS_OFFSET}."
          pnpm --filter @lubin/api run resilience:stars:backfill

      # Meme canal d'alerte que les autres crons : action pinnee sur son SHA de release.
      - name: Alerte e-mail en cas d echec
        if: failure()
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: lubindanilo2@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Resilience Backfill <lubindanilo2@gmail.com>
          to: lubindanilo2@gmail.com
          subject: "[Lubin Investment] Backfill Resilience en ECHEC (shard ${{ matrix.shard }})"
          body: |
            Le backfill du score de resilience a echoue sur le shard ${{ matrix.shard }} :
            aucune entreprise notee par ce shard cette nuit. Les autres shards ont pu aboutir.

            Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Declencheur : ${{ github.event_name }}

      # Second canal, SANS AUCUN SECRET (08/08/2026) : le mot de passe d'application Gmail du
      # step ci-dessus etait invalide (`530-5.7.0 Authentication Required` cote screener), donc
      # le canal unique d'alerte etait mort sans que rien ne le signale. Une issue GitHub ne
      # depend que de `github.token`. Un seul fil pour les 4 shards : le 1er shard en echec ouvre
      # l'issue, les suivants commentent.
      - name: Ouvrir une issue en cas d echec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[cron] Backfill Resilience en echec'
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            "Le backfill du score de resilience a echoue sur le shard ${{ matrix.shard }} : aucune" \
            "entreprise notee par ce shard. Les autres shards ont pu aboutir." \
            "" \
            "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- Declencheur : ${{ github.event_name }}")"
          existing="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
