name: Content lint articles (anti-crash)

# Garde-fou anti-crash (PAS un lint éditorial - la génération auto d'articles a été retirée) :
# `export const ARTICLES = [...]` doit être déclaré APRÈS toutes ses consts, sinon TDZ =>
# crash de la fonction Vercel à l'import, HTTP 500 sur tout le site (incident 2026-07-15).
# Reste utile tant qu'articles.ts peut être édité à la main.
#
# Tourne sur TOUTES les PRs (pas de filtre de chemin) pour toujours reporter un statut.
on:
  pull_request:
  workflow_dispatch: {}

jobs:
  articles-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier l'ordre des déclarations d'articles (anti-TDZ)
        run: node scripts/check-articles-order.mjs
