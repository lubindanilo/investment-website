name: Reparation trimestres flux US (recoupement SEC)

# Repare dans le store les trimestres de flux US faux (T4 derive trop haut, T2 reste en cumul
# semestriel) par recoupement avec la SEC : apps/api/scripts/repairQuarterlyFromEdgar.ts, regle
# dans apps/api/src/services/edgarQuarterReconcile.ts.
#
# POURQUOI CE WORKFLOW EXISTE (21/11/2026). Le script fait ~1 serie/s a cause du plafond SEC
# (10 req/s, limiteur a 8/s) : ~4 h par metrique sur ~3 500 tickers US. Trop long pour le poste de
# Lubin (veille a la fermeture du capot). Un job par metrique, chacun sur son propre runner.
#
# GARDE-FOUS. `apply` est FAUX par defaut (simulation). En ecriture, l'etat AVANT de chaque ligne
# modifiee est sauvegarde et publie en artefact (meme en cas d'echec). Le script est idempotent et
# s'arrete net au premier bridage SEC (429) en indiquant le --start de reprise.
#
# Secret requis : DATABASE_URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Ecrire en base. Decoche = simulation seule.'
        type: boolean
        required: false
        default: false
      metrics:
        description: 'Metriques (JSON), parmi revenue, netIncome, cfo.'
        type: string
        required: false
        default: '["revenue","netIncome","cfo"]'
      start:
        description: 'Rang de depart (reprise apres bridage), commun a toutes les metriques.'
        type: string
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: repair-quarterly-edgar
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        metric: ${{ fromJSON(inputs.metrics) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Prisma exige `directUrl` a la generation. Ce job ne migre rien : la meme URL suffit.
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Garde-fou secret
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Le secret DATABASE_URL est requis."
            exit 1
          fi
      - uses: actions/checkout@v4
      # Pas de `version:` : pnpm/action-setup lit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lubin/api exec prisma generate --schema=prisma/schema.prisma

      - name: Reparation ${{ matrix.metric }}
        env:
          APPLY: ${{ inputs.apply }}
          METRIC: ${{ matrix.metric }}
          START: ${{ inputs.start }}
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          FLAGS="--metrics=${METRIC} --concurrency=4 --start=${START} --report=$RUNNER_TEMP/out/corrections-${METRIC}.json"
          if [ "${APPLY}" = "true" ]; then
            echo "Mode ECRITURE."
            FLAGS="$FLAGS --apply --backup=$RUNNER_TEMP/out/before-${METRIC}.json"
          else
            echo "Mode SIMULATION (cocher 'apply' pour ecrire)."
          fi
          pnpm exec tsx scripts/repairQuarterlyFromEdgar.ts $FLAGS 2>&1 | grep -v '^\[edgar'

      - name: Artefacts (sauvegarde + corrections)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-${{ matrix.metric }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 30
