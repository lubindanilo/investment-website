name: Screener scoring

# Note la file du screener via l'endpoint HTTP déployé (mêmes clés/IP que la prod).
#   - workflow_dispatch : drain manuel d'une zone (defaut EU) — sert à rattraper le backlog
#     EU pending (ex : Renault RNO.PA) sans etre affame par la priorite US.
#   - schedule : petit tick de maintenance generique (garde l'univers frais apres coup).
#
# Alerte (point 3) : le job ECHOUE bruyamment si l'endpoint est injoignable, si le token est
# rejete, ou si le scoreur ne traite plus rien (garde anti-stall) — c'est exactement la panne
# silencieuse du 9 juin 2026. En cas d'echec, un e-mail est envoye a lubindanilo2@gmail.com
# via SMTP Gmail (necessite le secret MAIL_PASSWORD = mot de passe d'application Gmail).
# NB : GitHub desactive un workflow planifie apres 60 j d'INACTIVITE du repo — ici le repo
# est actif quotidiennement (PR SEO), donc ce risque ne s'applique pas en pratique.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Zone a drainer (EU, US, INTL, ou vide = univers entier)'
        required: false
        default: 'EU'
      n:
        description: 'Titres demandes par appel (max 25)'
        required: false
        default: '25'
      deadline:
        description: 'Budget scoring par appel en secondes (max 50)'
        required: false
        default: '45'
      passes:
        description: 'Nombre max d appels avant arret'
        required: false
        default: '400'
      seed:
        description: 'Seed uniquement (insere les tickers du code en base) : liste de regions ex "INTL,EU,US". Vide = pas de seed, scoring normal.'
        required: false
        default: ''
  schedule:
    # UN SEUL petit lot par jour (06:00 UTC). Volontairement minimal : la base Neon (plan Free,
    # 100 CU-h/mois) facture le TEMPS DE COMPUTE ACTIF. Les anciens crons (US/EU dediees, ~10
    # runs/j jusqu'a 180 min) gardaient le compute actif ~24/7 et ont crame le quota en 2 jours.
    # Ce run court (~15 min) suffit : la priorite "earnings d'abord" rafraichit ce qui compte
    # (societes qui viennent de publier), et le reste trickle du plus ancien. Le comble-trous
    # (EDGAR + stockanalysis) reste AUTOMATIQUE par-ticker → les trous historiques se bouchent
    # progressivement au fil du trickle, sans surcout (le comblage ne pese pas, c'est le VOLUME
    # qui pesait). Les rattrapages massifs se font a la main (workflow_dispatch), ponctuellement.
    - cron: '0 6 * * *'

permissions:
  contents: read
  # Canal d'alerte de secours (cf. step « Ouvrir une issue en cas d echec »).
  issues: write

concurrency:
  group: screener-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCREENER_TOKEN: ${{ secrets.SCREENER_TOKEN }}
      CONFIGURED_SITE_URL: ${{ vars.SCREENER_SITE_URL }}
      EVENT_NAME: ${{ github.event_name }}
      MANUAL_REGION: ${{ inputs.region }}
      MANUAL_N: ${{ inputs.n }}
      MANUAL_DEADLINE: ${{ inputs.deadline }}
      MANUAL_PASSES: ${{ inputs.passes }}
      MANUAL_SEED: ${{ inputs.seed }}
    steps:
      - name: Score due tickers
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SCREENER_TOKEN:-}" ]; then
            echo "::error::Le secret GitHub SCREENER_TOKEN est requis pour le cron screener."
            exit 1
          fi

          SITE_URL="${CONFIGURED_SITE_URL:-https://lubin-investment.com}"

          # ── Mode SEED (workflow_dispatch avec input 'seed' rempli) ──────────────────────
          # Insere en base les tickers des tableaux du code (createMany skipDuplicates, idempotent,
          # quelques secondes). NE FAIT PAS de scoring → aucun risque pour le quota Neon. A lancer
          # une fois apres avoir elargi l'univers ; le cron quotidien score ensuite au fil de l'eau.
          if [ -n "${MANUAL_SEED:-}" ]; then
            echo "Mode SEED : regions = ${MANUAL_SEED}"
            IFS=',' read -ra REGIONS <<< "${MANUAL_SEED}"
            for raw in "${REGIONS[@]}"; do
              reg="$(echo "$raw" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
              [ -z "$reg" ] && continue
              echo "→ seed ${reg}…"
              resp="$(curl --fail-with-body --silent --show-error --max-time 120 \
                -X POST -H "x-screener-token: ${SCREENER_TOKEN}" \
                "${SITE_URL}/api/screener/seed?region=${reg}")"
              echo "  ${reg}: ${resp}"
            done
            echo "Seed termine. Le cron quotidien scorera les nouveaux titres au fil des jours."
            exit 0
          fi

          # Selection selon l'evenement :
          #   - workflow_dispatch : on suit les inputs (rattrapage manuel ponctuel, gros lot OK
          #     car declenche a la demande en connaissant le cout compute).
          #   - schedule (le run quotidien) : lot COURT, toutes regions, priorite earnings.
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            REGION="${MANUAL_REGION:-}"
            N="${MANUAL_N:-25}"
            DEADLINE="${MANUAL_DEADLINE:-45}"
            PASSES="${MANUAL_PASSES:-400}"
            WARM="1"; FAST="0"
          else
            # Run quotidien minimal, earnings d'abord (phase 1), puis trickle du plus ancien.
            # Scoring en concurrence bornee cote API (K=4) → plus de titres par appel a compute
            # Neon egal. warm=0 : on coupe la phase warm graphiques (fetch + ecritures ChartCache)
            # sur le run quotidien pour economiser le compute Neon Free ; les graphes se
            # reconstruisent a la 1re consultation.
            #
            # fast=1 (07/08/2026) : ne pioche QUE les tickers sans point. Mesure du run du 06/08 :
            # 40 passes, 243 titres traites, 6 notes. Le budget par titre non-US est de 20 s et la
            # deadline d'appel de 30 s : un seul cycle rentrait, et il expirait. Pire, chaque
            # expiration bumpait `lastAttemptAt` donc rearmait le cooldown, et les memes titres
            # revenaient la nuit suivante (attempts a 11 sur 2330.TW) sans jamais etre notes.
            # Le non-US est desormais servi par le drain (runner sans lambda, 240 s par titre).
            #
            # BUDGET PAR TITRE (08/08/2026). fast=1 n'a pas suffi : le run du 08/08 a fait 11
            # passes a picked=25 / timeout=8 / scored=0, et le garde de rendement (ajoute la
            # veille) l'a enfin fait echouer. La cause n'est pas le choix des titres mais le
            # budget : 10 s par titre pour un snapshot qui en demande ~30 (mesure du drain de la
            # meme nuit — 800 titres notes, 0 timeout, 3,9/min en concurrence 2). Tout expirait.
            # On passe donc a 45 s par titre (?per=45), deadline 50 s, concurrence 2 (?conc=2 :
            # les limiteurs d'API sont globaux, monter la concurrence allonge la latence de chaque
            # titre au lieu de la reduire), n=6 pour laisser un worker enchainer si un titre sort
            # vite en nodata. Attendu : ~2 titres notes par appel au lieu de 0.
            # Cout : 40 passes x ~50 s = ~33 min d'endpoint actif, du meme ordre que les ~35 min
            # du run precedent qui, lui, ne notait rien.
            REGION=""; N="6"; DEADLINE="50"; PASSES="40"; WARM="0"; FAST="1"; PER="45"; CONC="2"
          fi

          QS="n=${N}&deadline=${DEADLINE}&warm=${WARM}&fast=${FAST}"
          # `per`/`conc` : uniquement sur le run planifie (contraint par la lambda). Le rattrapage
          # manuel garde les defauts du code, qui conviennent a ses deadlines plus larges.
          if [ -n "${PER:-}" ]; then QS="${QS}&per=${PER}"; fi
          if [ -n "${CONC:-}" ]; then QS="${QS}&conc=${CONC}"; fi
          if [ -n "${REGION}" ]; then QS="${QS}&region=${REGION}"; fi
          echo "Cible : ${SITE_URL}/api/screener/tick?${QS} (max ${PASSES} appels)"

          total_scored=0
          run_processed=0
          dead_streak=0
          barren_streak=0
          last_picked=0
          for pass in $(seq 1 "${PASSES}"); do
            # --fail-with-body : sort en erreur (donc job en echec -> alerte) sur HTTP >= 400,
            # ce qui couvre endpoint down, token rejete, deploiement casse.
            # --max-time 75 : la lambda a un maxDuration de 60 s et le run planifie l'occupe
            # jusqu'a ~50 s (deadline) + overhead. A 60 s, curl coupait avant la reponse.
            response="$(curl --fail-with-body --silent --show-error --max-time 75 \
              -X POST \
              -H "x-screener-token: ${SCREENER_TOKEN}" \
              "${SITE_URL}/api/screener/tick?${QS}")"
            picked="$(jq -r '.picked // 0' <<< "$response")"
            scored="$(jq -r '.scored // 0' <<< "$response")"
            nodata="$(jq -r '.nodata // 0' <<< "$response")"
            errors="$(jq -r '.error // 0' <<< "$response")"
            timeout="$(jq -r '.timeout // 0' <<< "$response")"
            processed=$((scored + nodata + errors + timeout))
            echo "Pass ${pass}: picked=${picked} scored=${scored} nodata=${nodata} error=${errors} timeout=${timeout}"

            last_picked="$picked"
            # Rien a piocher → la zone est drainee : on s'arrete proprement.
            if [ "$picked" -eq 0 ]; then
              echo "File vide — arret anticipe."
              break
            fi

            # Garde anti-stall : l'endpoint repond 200 mais ne traite RIEN alors qu'il y a du
            # travail (picked>0). 3 fois d'affilee = scoreur casse -> on echoue (alerte).
            # NB : une erreur de scoring (ex 403 Finnhub sur un ticker EU) compte dans
            # `processed`, donc ne declenche PAS de faux positif ici.
            if [ "$processed" -eq 0 ]; then
              dead_streak=$((dead_streak + 1))
              if [ "$dead_streak" -ge 3 ]; then
                echo "::error::Scoreur bloque : picked>0 mais 0 titre traite sur 3 appels consecutifs."
                exit 1
              fi
            else
              dead_streak=0
            fi

            # Garde de RENDEMENT (07/08/2026). La garde ci-dessus compte un timeout comme un titre
            # « traite », si bien qu'un run peut expirer sur 243 titres, n'en noter que 6, et rester
            # VERT — c'est exactement ce qui s'est passe toutes les nuits du 01 au 06/08. Or c'est
            # la panne que ce workflow existe pour detecter. On surveille donc aussi ce que le run
            # PRODUIT, pas seulement qu'il s'agite. Seuil large (10) : une passe peut legitimement
            # ne rien noter si tous les titres piochés sortent en nodata.
            if [ "$scored" -eq 0 ]; then
              barren_streak=$((barren_streak + 1))
              if [ "$barren_streak" -ge 10 ]; then
                echo "::error::Scoreur sterile : picked>0 mais 0 titre NOTE sur 10 appels consecutifs (timeouts ?)."
                exit 1
              fi
            else
              barren_streak=0
            fi

            total_scored=$((total_scored + scored))
            run_processed=$((run_processed + processed))
            sleep 2
          done

          echo "Total note sur ce run : ${total_scored} (traites : ${run_processed})"
          echo "Etat global :"
          curl --fail --silent --show-error "${SITE_URL}/api/screener/stats" | jq .

          # Filet final : il restait du travail (last_picked>0) mais on n'a rien traite du tout.
          if [ "${last_picked}" -gt 0 ] && [ "${run_processed}" -eq 0 ]; then
            echo "::error::Aucun titre traite alors que la file n'etait pas vide."
            exit 1
          fi

      # Alerte e-mail (point 3) : envoi direct a lubindanilo2@gmail.com via SMTP Gmail.
      # Un seul secret requis : MAIL_PASSWORD = mot de passe d'application Gmail du compte
      # lubindanilo2@gmail.com (Google Account -> Securite -> Validation en 2 etapes ->
      # Mots de passe des applications). L'action tierce est pinnee sur son SHA de release.
      - name: Alerte e-mail en cas d echec
        if: failure()
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: lubindanilo2@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Screener Cron <lubindanilo2@gmail.com>
          to: lubindanilo2@gmail.com
          subject: "[Lubin Investment] Cron Screener scoring en ECHEC"
          body: |
            Le cron de notation du screener a echoue.
            La notation risque d'etre a l'arret (rappel : panne silencieuse du 9 juin 2026).

            Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Declencheur : ${{ github.event_name }}

      # Second canal, SANS AUCUN SECRET (08/08/2026). L'e-mail ci-dessus est un point de
      # defaillance unique, et il ETAIT tombe : le run du 08/08 a echoue puis n'a pas pu alerter
      # (`530-5.7.0 Authentication Required` — mot de passe d'application Gmail invalide). La
      # panne existait, personne ne l'a su : exactement le scenario que ce workflow existe pour
      # rendre impossible. Une issue GitHub ne depend que de `github.token`, donc elle ne peut pas
      # expirer, et elle notifie par les abonnements du repo. Idempotente : si une issue du meme
      # titre est deja ouverte, on y ajoute un commentaire au lieu d'en empiler une par nuit.
      - name: Ouvrir une issue en cas d echec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[cron] Screener scoring en echec'
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            "Le cron de notation du screener a echoue (rappel : panne silencieuse du 9 juin 2026)." \
            "" \
            "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- Declencheur : ${{ github.event_name }}")"
          existing="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
