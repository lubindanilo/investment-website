name: Backfill stockanalysis (profondeur des titres non-US)

# Rattrapage MANUEL de la profondeur d'historique des titres non-US, depuis le runner.
#
# Pourquoi un job dédié plutôt qu'attendre les scorings : l'accumulation stockanalysis tourne
# normalement à la cadence des résultats (cf. scoreSnapshot), donc un titre ne se complète qu'à sa
# prochaine publication. Après une correction de la source ou du parser, ça veut dire des mois
# d'attente avant que les graphes profitent du correctif. Ce job force le tour complet.
#
# Pourquoi le runner et pas Vercel : mêmes raisons que screener-drain.yml — l'IP des lambdas est
# throttlée par les sources, et un seul process rend les limiters Bottleneck honnêtes (ici 1 req/s
# vers stockanalysis, throttle interne au service).
#
# Coût base : léger et sans rapport avec le drain. Le script ne SCORE rien — il lit une ligne de
# store par métrique et n'écrit que les périodes absentes (append-only). L'essentiel du temps est
# du réseau au throttle, pas du compute Neon. Le vrai plafond est donc la durée du job.
#
# Auto-limitant, donc rejouable sans risque :
#   - la passe intra-annuelle saute les tickers dont le CA stocké est déjà frais ;
#   - la passe annuelle se coupe dès que le store annuel atteint sa profondeur cible.
# Un run interrompu (timeout) ne perd rien : chaque ticker est persisté au fil de l'eau, et le run
# suivant reprend là où l'état de la base le place.
#
# Secret requis : DATABASE_URL (connexion Neon poolée).

on:
  workflow_dispatch:
    inputs:
      opp_only:
        description: 'Limiter aux candidats bien notes (note >= 8) : 1 pour oui, 0 pour tout l univers'
        required: false
        default: '0'
      timeout_minutes:
        description: 'Plafond dur du job en minutes (le script est reprenable, un timeout ne perd rien)'
        required: false
        default: '180'

permissions:
  contents: read
  # Canal d'alerte sans secret (le mot de passe d'application Gmail partagé par les crons s'est
  # déjà révélé invalide en silence le 08/08/2026).
  issues: write

concurrency:
  group: stockanalysis-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '180') }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Prisma exige `directUrl` à la génération (datasource du schéma). Ce job ne migre rien :
      # la même URL suffit, comme dans build:vercel et screener-drain.
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Garde-fou secret
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Le secret DATABASE_URL est requis (connexion Neon poolee)."
            exit 1
          fi
      - uses: actions/checkout@v4
      # Pas de `version:` : pnpm/action-setup lit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lubin/api exec prisma generate --schema=prisma/schema.prisma
      - name: Backfill
        # L'input passe par l'ENV et non par interpolation dans le shell : le repo est public, une
        # valeur d'input ne doit pas pouvoir devenir du code.
        env:
          OPP_ONLY: ${{ inputs.opp_only }}
        run: |
          set -euo pipefail
          if [ "${OPP_ONLY:-0}" = "1" ]; then
            pnpm --filter @lubin/api run stockanalysis:backfill -- --opp-only
          else
            pnpm --filter @lubin/api run stockanalysis:backfill
          fi

      - name: Ouvrir une issue en cas d echec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[backfill] Profondeur stockanalysis en echec'
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            "Le backfill de profondeur stockanalysis a echoue." \
            "" \
            "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- Declencheur : ${{ github.event_name }}" \
            "" \
            "Le script est reprenable : relancer le workflow suffit, rien n'est perdu.")"
          existing="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
