name: Resilience revue manuelle (correctifs a la main)

# Applique en base les corrections de notes de resilience decidees a la main
# (apps/api/scripts/resilienceStarsManualReview.ts).
#
# POURQUOI CE WORKFLOW EXISTE (11/08/2026). Le script etait pense pour tourner depuis le poste de
# Lubin, avec le DATABASE_URL de prod dans un .env local. C'est la meme dependance a une machine
# unique qui avait tue le backfill jusqu'au 05/08 (cf. resilience-cron.yml) : le jour ou le poste
# n'a ni Node ni .env, une correction validee ne peut plus atteindre la prod. Le secret
# DATABASE_URL est deja pose ici pour les crons ; ce workflow lui donne un point d'entree manuel.
#
# GARDE-FOUS. `apply` est FAUX par defaut : un lancement sans y toucher se contente de simuler et
# d'afficher les lignes qui bougeraient. Le script lui-meme refuse d'ecrire si le total en base ne
# correspond pas au `from` attendu, ou si la somme des criteres ne retombe pas sur le `to`, et il
# est idempotent (une ligne deja corrigee est ignoree). On peut donc le relancer sans risque.
#
# Secret requis : DATABASE_URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Ecrire en base. Decoche = simulation seule (affiche ce qui changerait).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: resilience-manual-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Prisma exige `directUrl` a la generation. Ce job ne migre rien : la meme URL suffit.
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Garde-fou secret
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Le secret DATABASE_URL est requis."
            exit 1
          fi
      - uses: actions/checkout@v4
      # Pas de `version:` : pnpm/action-setup lit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lubin/api exec prisma generate --schema=prisma/schema.prisma

      - name: Revue manuelle
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "${APPLY}" = "true" ]; then
            echo "Mode ECRITURE."
            pnpm --filter @lubin/api run resilience:stars:manual-review -- --apply
          else
            echo "Mode SIMULATION (cocher 'apply' pour ecrire)."
            pnpm --filter @lubin/api run resilience:stars:manual-review
          fi
